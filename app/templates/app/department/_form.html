<form method="post" id="department-form">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}
    <div class="form-field mb-3">
        <label for="{{ form.company.id_for_label }}" class="form-label">会社</label>
        {{ form.company }}
        <div class="text-danger small">{{ form.company.errors }}</div>
    </div>
    <div class="form-field mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label">部門名</label>
        {{ form.name }}
        <div class="text-danger small">{{ form.name.errors }}</div>
    </div>
    <button type="submit" id="department-form-submit" class="btn btn-primary">保存</button>
</form>
