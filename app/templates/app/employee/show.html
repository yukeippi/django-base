{% extends 'layouts/default.html' %}

{% block title %}{{ employee }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 id="employee-name" class="mb-0">{{ employee }}</h1>
    <div>
        <a href="{% url 'app:employee_index' %}" class="btn btn-outline-secondary">一覧に戻る</a>
        <a href="{% url 'app:employee_edit' employee.pk %}" id="edit-employee-link" class="btn btn-primary">編集</a>
        <a href="{% url 'app:employee_delete' employee.pk %}" id="delete-employee-link" class="btn btn-danger">削除</a>
    </div>
</div>

<div class="employee-detail card">
    <div class="card-body">
        <div class="employee-field mb-3">
            <label class="form-label fw-bold">社員番号:</label>
            <p id="employee-number">{{ employee.employee_number }}</p>
        </div>
        <div class="employee-field mb-0">
            <label class="form-label fw-bold">氏名:</label>
            <p id="employee-full-name">{{ employee }}</p>
        </div>
    </div>
</div>
{% endblock %}
