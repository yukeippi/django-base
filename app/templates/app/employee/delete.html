{% extends 'layouts/default.html' %}

{% block title %}社員削除確認{% endblock %}

{% block content %}
<h1>社員情報を削除しますか?</h1>

<div class="card">
    <div class="card-body">
        <p id="delete-employee-name" class="fs-5">{{ employee }}</p>

        <form method="post" id="employee-delete-form" class="d-inline">
            {% csrf_token %}
            <button type="submit" id="employee-delete-confirm" class="btn btn-danger">削除する</button>
        </form>
        <a href="{% url 'app:employee_show' employee.pk %}" class="btn btn-outline-secondary">キャンセル</a>
    </div>
</div>
{% endblock %}
