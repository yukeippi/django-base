{% extends 'layouts/default.html' %}

{% block title %}会社一覧{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">会社一覧</h1>
    <div>
        <a href="{% url 'app:index' %}" class="btn btn-outline-secondary">ホームに戻る</a>
        <a href="{% url 'app:company_new' %}" id="new-company-link" class="btn btn-success">新規作成</a>
    </div>
</div>

{% if companies %}
    <table id="company-table" class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th>会社名</th>
            </tr>
        </thead>
        <tbody>
            {% for company in companies %}
            <tr class="company-row" data-href="{% url 'app:company_show' company.pk %}">
                <td>{{ company.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p id="no-companies" class="alert alert-info">会社が登録されていません。</p>
{% endif %}
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('.company-row').forEach(function (row) {
    row.addEventListener('click', function () {
        window.location.href = row.dataset.href;
    });
});
</script>
{% endblock %}
