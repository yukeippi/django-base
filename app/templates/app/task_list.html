<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク一覧</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .task-row {
            cursor: pointer;
        }
        .task-row:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>タスク一覧</h1>
    <a href="{% url 'app:index' %}">ホームに戻る</a>

    {% if tasks %}
        <table id="task-table">
            <thead>
                <tr>
                    <th>タイトル</th>
                    <th>ステータス</th>
                    <th>優先度</th>
                    <th>作成日時</th>
                </tr>
            </thead>
            <tbody>
                {% for task in tasks %}
                <tr class="task-row" data-task-id="{{ task.id }}">
                    <td>{{ task.title }}</td>
                    <td>{{ task.get_status_display }}</td>
                    <td>{{ task.priority }}</td>
                    <td>{{ task.created_at|date:"Y-m-d H:i" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p id="no-tasks">タスクがありません。</p>
    {% endif %}
</body>
</html>
