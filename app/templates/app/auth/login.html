{% extends 'layouts/default.html' %}

{% block title %}ログイン{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="mb-4">ログイン</h1>
        <form method="post" id="login-form">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="form-field mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required autofocus>
                <div class="text-danger small">{{ form.username.errors }}</div>
            </div>
            <div class="form-field mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
                <div class="text-danger small">{{ form.password.errors }}</div>
            </div>
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <button type="submit" id="login-submit" class="btn btn-primary">ログイン</button>
        </form>
    </div>
</div>
{% endblock %}
